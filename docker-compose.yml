services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sim
      POSTGRES_USER: sim
      POSTGRES_PASSWORD: sim
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sim -d sim"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["8080:8080"]
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro

  api:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8000:8000"]
    volumes:
      - object-storage:/data/storage

volumes:
  postgres-data:
  object-storage:
