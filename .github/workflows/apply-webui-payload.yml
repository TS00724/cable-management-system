name: Apply verified WebUI patch

on:
  push:
    branches: ["agent/open-source-webui-continued"]
    paths:
      - ".publish/webui-patch-part-*"
      - ".github/workflows/apply-webui-payload.yml"
  pull_request:
    branches: ["main"]
    paths:
      - ".publish/webui-patch-part-*"
      - ".github/workflows/apply-webui-payload.yml"

permissions:
  contents: write

concurrency:
  group: apply-webui-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: github.event_name == 'pull_request' || contains(github.event.head_commit.message, 'stage verified WebUI payload')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - name: Rehydrate and apply source patch
        shell: bash
        run: |
          cat .publish/webui-patch-part-* | base64 --decode > /tmp/webui.patch.xz
          echo "1b385b31e2186e21b8e6a184d0ee8f218e9f50589c4f7f2f8575acab752dc5b5  /tmp/webui.patch.xz" | sha256sum --check -
          xz --decompress --stdout /tmp/webui.patch.xz > /tmp/webui.patch
          git apply --binary --index /tmp/webui.patch
          rm -rf .publish .github/workflows/apply-webui-payload.yml
      - name: Apply CI-discovered source corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          client = Path("apps/web/src/api/client.test.ts")
          text = client.read_text()
          old = 'import { ApiError } from "./errors";'
          assert old in text
          client.write_text(text.replace(old, 'import type { ApiError } from "./errors";', 1))

          shell = Path("apps/web/src/components/AppShell.tsx")
          text = shell.read_text()
          assert "const navigate = useNavigate();" in text
          text = text.replace("  const navigate = useNavigate();\n", "")
          text = re.sub(r"\buseNavigate,\s*", "", text)
          text = re.sub(r",\s*useNavigate\b", "", text)
          shell.write_text(text)

          legacy = Path("apps/web/src/legacy/webgl-viewer.ts")
          text = legacy.read_text()
          assert text.startswith("// @ts-nocheck")
          text = text.replace(
              "// @ts-nocheck",
              "/* eslint-disable @typescript-eslint/ban-ts-comment */\n// @ts-nocheck",
              1,
          )
          old = "this.mode==='rack'?this.renderRack():this.renderRoute()"
          assert old in text
          text = text.replace(
              old,
              "if(this.mode==='rack'){this.renderRack()}else{this.renderRoute()}",
              1,
          )
          legacy.write_text(text)

          locations = Path("apps/web/src/pages/LocationsPage.tsx")
          text = locations.read_text()
          updated, count = re.subn(
              r"const tree = useMemo\(\(\) => buildLocationTree\(rows\), \[rows\]\);",
              "const tree = buildLocationTree(rows);",
              text,
          )
          assert count == 1, count
          updated = re.sub(r"\buseMemo,\s*", "", updated)
          updated = re.sub(r",\s*useMemo\b", "", updated)
          locations.write_text(updated)
          PY
      - name: Install backend dependencies
        run: pip install -e ".[dev]"
      - name: Verify committed OpenAPI contract
        shell: bash
        run: |
          cp apps/web/openapi.json /tmp/openapi.expected.json
          python scripts/export_openapi.py
          cmp /tmp/openapi.expected.json apps/web/openapi.json
      - name: Install frontend dependencies and lock graph
        working-directory: apps/web
        run: npm install --legacy-peer-deps --no-audit --no-fund --save-dev @testing-library/dom@10.4.1
      - name: Frontend lint
        working-directory: apps/web
        run: npm run lint
      - name: Frontend unit and component tests
        working-directory: apps/web
        run: npm run test
      - name: Frontend production build
        working-directory: apps/web
        run: npm run build
      - name: Backend regression and WebUI API tests
        working-directory: apps/api
        run: PYTHONPATH=. pytest -q
      - name: Python and preserved legacy checks
        shell: bash
        run: |
          cd apps/api
          PYTHONPATH=. python -m compileall -q app migrations
          cd ../..
          node --check apps/web-legacy/app.js
          node --check apps/web-legacy/webgl-viewer.js
      - name: Fresh migration and idempotent seed
        working-directory: apps/api
        env:
          DATABASE_URL: sqlite+pysqlite:///./ci.db
          PLATFORM_DATABASE_URL: sqlite+pysqlite:///./ci.db
          MIGRATION_DATABASE_URL: sqlite+pysqlite:///./ci.db
        run: |
          PYTHONPATH=. alembic upgrade head
          PYTHONPATH=. python -m app.seed
          PYTHONPATH=. python -m app.seed
      - name: Commit verified source and dependency lock
        shell: bash
        run: |
          rm -rf apps/web/dist apps/web/coverage
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrate WebUI to React Refine and Ant Design"
          target_branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git push origin "HEAD:${target_branch}"
