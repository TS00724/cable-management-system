name: CI

on:
  push:
    branches: ["main", "agent/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e ".[dev]"
      - name: Python tests
        working-directory: apps/api
        run: PYTHONPATH=. pytest -q
      - name: Python compile
        working-directory: apps/api
        run: PYTHONPATH=. python -m compileall -q app migrations
      - name: Frontend syntax
        run: |
          node --check apps/web/app.js
          node --check apps/web/webgl-viewer.js
      - name: Fresh migration and idempotent seed
        working-directory: apps/api
        env:
          DATABASE_URL: sqlite+pysqlite:///./ci.db
          PLATFORM_DATABASE_URL: sqlite+pysqlite:///./ci.db
          MIGRATION_DATABASE_URL: sqlite+pysqlite:///./ci.db
        run: |
          PYTHONPATH=. alembic upgrade head
          PYTHONPATH=. python -m app.seed
          PYTHONPATH=. python -m app.seed
