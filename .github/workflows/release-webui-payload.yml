name: Release verified open-source WebUI continuation

on:
  push:
    branches:
      - agent/open-source-webui-release
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message || '', '[webui-release-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RELEASE_BRANCH: agent/open-source-webui-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Retrieve uploaded payload objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .payload
          for entry in \
            "001:ab9443399cb0042e158eeba9ee5e88619e9680ec" \
            "002:66321a46517d28fbbd1f7782e3c163535be82b95" \
            "003:4555f27115b8154f88512b073f434aa77623d417"
          do
            number="${entry%%:*}"
            sha="${entry##*:}"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github.raw+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              -o ".payload/part-${number}"
            test -s ".payload/part-${number}"
          done

      - name: Reconstruct and apply uploaded payload
        run: python .payload/apply_payload.py

      - name: Remove one-time release transport
        run: |
          rm -rf .payload
          rm -f .github/workflows/release-webui-payload.yml

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install -e '.[dev]'

      - name: Backend tests
        working-directory: apps/api
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. pytest -q | tee ../../../backend-test-output.txt

      - name: Python compile
        working-directory: apps/api
        run: PYTHONPATH=. python -m compileall -q app migrations

      - name: Fresh migration and idempotent seed
        working-directory: apps/api
        env:
          DATABASE_URL: sqlite+pysqlite:///./release-ci.db
          PLATFORM_DATABASE_URL: sqlite+pysqlite:///./release-ci.db
          MIGRATION_DATABASE_URL: sqlite+pysqlite:///./release-ci.db
        run: |
          rm -f release-ci.db
          PYTHONPATH=. alembic upgrade head
          PYTHONPATH=. python -m app.seed
          PYTHONPATH=. python -m app.seed

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: apps/web
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Frontend typecheck
        working-directory: apps/web
        run: npm run typecheck --if-present

      - name: Frontend component tests
        working-directory: apps/web
        shell: bash
        run: |
          set -o pipefail
          npm run test --if-present -- --run | tee ../../frontend-test-output.txt

      - name: Frontend production build
        working-directory: apps/web
        run: npm run build

      - name: Record clean-run verification
        shell: bash
        run: |
          backend_summary="$(tail -n 1 backend-test-output.txt 2>/dev/null || true)"
          frontend_summary="$(tail -n 3 frontend-test-output.txt 2>/dev/null | tr '\n' ' ' || true)"
          cat > PAYLOAD_VERIFICATION.md <<EOF
          # Open-Source WebUI Continuation — Clean Verification

          - Verification date: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - GitHub Actions run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Source branch: ${GITHUB_REF_NAME}
          - Backend tests: passed — ${backend_summary}
          - Python compile: passed
          - Fresh migration: passed
          - Seed idempotency: passed
          - Frontend dependency installation: passed
          - TypeScript typecheck: passed
          - Frontend component tests: passed — ${frontend_summary}
          - Frontend production build: passed

          This record certifies only the automated boundaries above. Browser/WebGL E2E,
          accessibility, PostgreSQL non-owner RLS, OIDC and production operations remain
          separate acceptance gates.
          EOF
          rm -f backend-test-output.txt frontend-test-output.txt apps/api/release-ci.db

      - name: Commit verified source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Migrate frontend to open-source enterprise WebUI [webui-release-applied]'
          git push origin HEAD:${RELEASE_BRANCH}

      - name: Create or locate draft pull request
        id: pull_request
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          existing="$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${RELEASE_BRANCH}" --base main --state open --json url --jq '.[0].url // empty')"
          if [ -n "${existing}" ]; then
            echo "url=${existing}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          cat > /tmp/pr-body.md <<'EOF'
          ## Summary

          Continues the Structured Infrastructure Manager by replacing the active hand-built frontend foundation with a maintainable open-source enterprise WebUI stack.

          ### Delivered

          - React + TypeScript + Vite application foundation
          - Refine resource/data orchestration
          - Ant Design enterprise shell and data-heavy components
          - tenant-aware FastAPI integration
          - migrated dashboard and core infrastructure/operations views
          - preserved legacy WebGL implementation for comparison and parity work
          - Cable Schedule export and expanded backend regression tests
          - independent backend/frontend CI gates
          - frontend typecheck, component tests and production build
          - Nginx production container and API reverse proxy
          - third-party software inventory and module-by-module progress audit

          ## Clean verification

          The source commit is created only after backend tests, Python compilation, fresh migration, idempotent seed, frontend dependency installation, TypeScript typecheck, component tests and production build all pass in GitHub Actions. See `PAYLOAD_VERIFICATION.md` and `docs/WEBUI_PROGRESS_AUDIT.md`.

          ## Not claimed complete

          Browser/WebGL E2E, WCAG/accessibility validation, device-matrix testing, production OIDC, non-owner PostgreSQL RLS proof, secure object storage, deep fiber/splice modeling and the remaining enterprise integrations are still open and are not marked 100% complete.
          EOF
          url="$(gh pr create --repo "${GITHUB_REPOSITORY}" --draft --base main --head "${RELEASE_BRANCH}" --title 'Migrate frontend to open-source enterprise WebUI' --body-file /tmp/pr-body.md)"
          echo "url=${url}" >> "${GITHUB_OUTPUT}"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webui-release-failure-${{ github.run_id }}
          path: |
            backend-test-output.txt
            frontend-test-output.txt
            apps/api/release-ci.db
          if-no-files-found: ignore
          retention-days: 7
